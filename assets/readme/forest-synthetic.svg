<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="836" viewBox="0 0 1200 836" role="img" aria-label="Synthetic data: ratio A / B at horizon 1 (below 1 = A better)"><title>Synthetic data: ratio A / B at horizon 1 (below 1 = A better)</title><style>
.s{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif} .m{font-family:'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes flow{to{stroke-dashoffset:-40}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.fade{animation:fade .8s ease-out both} .rise{animation:rise .7s ease-out both}
.flow{stroke-dasharray:8 6;animation:flow 1.6s linear infinite}
