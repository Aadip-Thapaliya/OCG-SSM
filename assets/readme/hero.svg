<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="OCG-SSM: Online Causal-Graph-Conditioned State-Space Forecasting"><title>OCG-SSM: Online Causal-Graph-Conditioned State-Space Forecasting</title><style>
.s{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif} .m{font-family:'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes flow{to{stroke-dashoffset:-40}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.fade{animation:fade .8s ease-out both} .rise{animation:rise .7s ease-out both}
.flow{stroke-dasharray:8 6;animation:flow 1.6s linear infinite}
</style><defs><linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#15243e"/><stop offset="1" stop-color="#0e1a2f"/></linearGradient><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a9b8cf"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f0803c"/></marker></defs><rect x="4" y="4" width="1192" height="432" rx="16" fill="url(#pg)" stroke="#2a3d61"/><text x="50" y="84" class="m" font-size="16" fill="#f0803c" text-anchor="start" >// bachelor&#x27;s thesis · University of Europe for Applied Sciences · 2026</text><text x="50" y="168" class="s fade" font-size="84" fill="#f3e9d2" text-anchor="start" font-weight="800" >OCG-SSM</text><text x="50" y="214" class="s" font-size="28" fill="#f3e9d2" text-anchor="start" >Online Causal-Graph-Conditioned</text><text x="50" y="250" class="s" font-size="28" fill="#f3e9d2" text-anchor="start" >State-Space Forecasting</text><g class="rise" style="animation-delay:0.6s"><rect x="50" y="300" width="194" height="34" rx="17" fill="#0e1a2f" stroke="#2a3d61"/><text x="146.95999999999998" y="322" class="m" font-size="16" fill="#f3e9d2" text-anchor="middle" >bachelor&#x27;s thesis</text></g><g class="rise" style="animation-delay:0.7s"><rect x="254" y="300" width="145" height="34" rx="17" fill="#0e1a2f" stroke="#2a3d61"/><text x="326.48" y="322" class="m" font-size="16" fill="#f3e9d2" text-anchor="middle" >pure PyTorch</text></g><g class="rise" style="animation-delay:0.8s"><rect x="409" y="300" width="223" height="34" rx="17" fill="#0e1a2f" stroke="#2a3d61"/><text x="520.64" y="322" class="m" font-size="16" fill="#f3e9d2" text-anchor="middle" >pre-registered gates</text></g><g class="rise" style="animation-delay:0.9s"><rect x="642" y="300" width="106" height="34" rx="17" fill="#0e1a2f" stroke="#2a3d61"/><text x="695.28" y="322" class="m" font-size="16" fill="#f3e9d2" text-anchor="middle" >96 tests</text></g><text x="50" y="380" class="s" font-size="17" fill="#a9b8cf" text-anchor="start" >Learn a sparse lagged graph. Let it decide which variables</text><text x="50" y="404" class="s" font-size="17" fill="#a9b8cf" text-anchor="start" >may talk inside a state-space model. Keep learning online.</text><path d="M778,130 C919.0,130 919.0,200 1060,200" fill="none" stroke="#f0803c" stroke-width="2.4" opacity=".85" class="flow" marker-end="url(#ao)" style="animation-delay:0.0s"/><path d="M918,130 C989.0,130 989.0,130 1060,130" fill="none" stroke="#5fb3a6" stroke-width="2.4" opacity=".85" class="flow" marker-end="url(#ao)" style="animation-delay:0.2s"/><path d="M918,200 C989.0,200 989.0,270 1060,270" fill="none" stroke="#5fb3a6" stroke-width="2.4" opacity=".85" class="flow" marker-end="url(#ao)" style="animation-delay:0.4s"/><path d="M778,270 C919.0,270 919.0,340 1060,340" fill="none" stroke="#f0803c" stroke-width="2.4" opacity=".85" class="flow" marker-end="url(#ao)" style="animation-delay:0.6s"/><path d="M918,340 C989.0,340 989.0,340 1060,340" fill="none" stroke="#5fb3a6" stroke-width="2.4" opacity=".85" class="flow" marker-end="url(#ao)" style="animation-delay:0.8s"/><path d="M918,270 C989.0,270 989.0,200 1060,200" fill="none" stroke="#5fb3a6" stroke-width="2.4" opacity=".85" class="flow" marker-end="url(#ao)" style="animation-delay:1.0s"/><path d="M778,200 C919.0,200 919.0,130 1060,130" fill="none" stroke="#f0803c" stroke-width="2.4" opacity=".85" class="flow" marker-end="url(#ao)" style="animation-delay:1.2s"/><text x="760" y="96" class="m" font-size="16" fill="#a9b8cf" text-anchor="middle" >x(t-2)</text><circle cx="760" cy="130" r="17" fill="#0e1a2f" stroke="#6b7f9e" stroke-width="2.4"/><text x="760" y="135" class="m" font-size="13" fill="#f3e9d2" text-anchor="middle" >x1</text><circle cx="760" cy="200" r="17" fill="#0e1a2f" stroke="#6b7f9e" stroke-width="2.4"/><text x="760" y="205" class="m" font-size="