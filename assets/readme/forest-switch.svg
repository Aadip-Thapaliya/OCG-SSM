<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="512" viewBox="0 0 1200 512" role="img" aria-label="After an abrupt graph switch: differences with 95% CI (below 0 = A better)"><title>After an abrupt graph switch: differences with 95% CI (below 0 = A better)</title><style>
.s{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif} .m{font-family:'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes flow{to{stroke-dashoffset:-40}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.fade{animation:fade .8s ease-out both} .rise{animation:rise .7s ease-out both}
.flow{stroke-dasharray:8 6;animation:flow 1.6s linear infinite}
</style><defs><linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#15243e"/><stop offset="1" stop-color="#0e1a2f"/></linearGradient><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a9b8cf"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f0803c"/></marker></defs><rect x="4" y="4" width="1192" height="504" rx="16" fill="url(#pg)" stroke="#2a3d61"/><text x="40" y="50" class="s" font-size="22" fill="#f3e9d2" text-anchor="start" font-weight="800" >After an abrupt graph switch: differences with 95% CI (below 0 = A better)</text><text x="40" y="76" class="m" font-size="14" fill="#a9b8cf" text-anchor="start" >online, prequential evaluation · 5 held-out seeds per stage</text><text x="40" y="142" class="m" font-size="15" fill="#f0803c" text-anchor="start" font-weight="700" >S5, first 200 windows after the switch</text><text x="56" y="178" class="s" font-size="15.5" fill="#f3e9d2" text-anchor="start" >learned + detector  −  frozen learned</text><text x="56" y="214" class="s" font-size="15.5" fill="#f3e9d2" text-anchor="start" >learned + detector  −  dense online</text><text x="40" y="250" class="m" font-size="15" fill="#f0803c" text-anchor="start" font-weight="700" >S5b, EMA reset + replay</text><text x="56" y="286" class="s" font-size="15.5" fill="#f3e9d2" text-anchor="start" >learned_fast  −  dense online</text><text x="40" y="322" class="m" font-size="15" fill="#f0803c" text-anchor="start" font-weight="700" >Pooled S5 + S5b, 10 seeds (post hoc, descriptive)</text><text x="56" y="358" class="s" font-size="15.5" fill="#f3e9d2" text-anchor="start" >before the switch</text><text x="56" y="394" class="s" font-size="15.5" fill="#f3e9d2" text-anchor="start" >first 200 windows after</text><text x="56" y="430" class="s" font-size="15.5" fill="#f3e9d2" text-anchor="start" >windows 200-495 after</text><text x="835.0" y="104" class="m" font-size="15" fill="#a9b8cf" text-anchor="middle" font-weight="700" >mean-MSE difference A − B  (× 10⁻³)</text><rect x="510.0" y="118" width="650" height="324" fill="#0e1a2f" opacity=".55" rx="6"/><line x1="510.0" y1="118" x2="510.0" y2="442" stroke="#1f3050"/><text x="510.0" y="464" class="m" font-size="13" fill="#6b7f9e" text-anchor="middle" >-2</text><line x1="672.5" y1="118" x2="672.5" y2="442" stroke="#1f3050"/><text x="672.5" y="464" class="m" font-size="13" fill="#6b7f9e" text-anchor="middle" >-1</text><line x1="835.0" y1="118" x2="835.0" y2="442" stroke="#1f3050"/><text x="835.0" y="464" class="m" font-size="13" fill="#6b7f9e" text-anchor="middle" >0</text><line x1="997.5" y1="118" x2="997.5" y2="442" stroke="#1f3050"/><text x="997.5" y="464" class="m" font-size="13" fill="#6b7f9e" text-anchor="middle" >+1</text><line x1="1160.0" y1="118" x2="1160.0" y2="442" stroke="#1f3050"/><text x="1160.0" y="464" class="m" font-size="13" fill="#6b7f9e" text-anchor="middle" >+2</text><line x1="835.0" y1="114" x2="835.0" y2="446" stroke="#f3e9d2" stroke-opacity=".6" stroke-dasharray="4 4"/><g><line x1="537.5" y1="172.0" x2="590.9" y2="172.0" stroke="#5fb3a6" stroke-width="3" stroke-linecap="round"/><path d="M565.1,164.0 l7,8 l-7,8 l-7,-8 z" fill="#5fb3a6"/></g><g><line x1="839.2" y1="208.0" x2="869.3" y2="208.0" stroke="#e5684f" stroke-width="3" stroke-linecap="round"/><path d="M854.0,200.0 l7,8 l-7,8 l-7,-8 z" fill="#e5684f"/></g><g><line x1="972.5" y1="280.0" x2="1051.8" y2="280.0" stroke="#e5684f" stroke-width="3" stroke-linecap="round"/><path d="M1011.2,272.0 l7,8 l-7,8 l-7,-8 z" fill="#e5684f"/></g><g><line x1="730.0" y1="352.0" x2="752.6" y2="352.0" stroke="#5fb3a6" stroke-width="3" stroke-linecap="round"/><path d="M741.9,344.0 l7,8 l-7,8 l-7,-8 z" fill="#5fb3a6"/></g><g><line x1="895.0" y1="388.0" x2="937.9" y2="388.0" stroke="#e5684f" stroke-width="3" stroke-linecap="round"/><path d="M915.6,380.0 l7,8 l-7,8 l-7,-8 z" fill="#e5684f"/></g><g><line x1="1030.8" y1="424.0" x2="1090.8" y2="424.0" stroke="#e5684f" stroke-width="3" stroke-linecap="round"/><path d="M1061.0,416.0 l7,8 l-7,8 l-7,-8 z" fill="#e5684f"/></g><path d="M47,473 l6,6 l-6,6 l-6,-6 z" fill="#5fb3a6"/><text x="60" y="484" class="m" font-size="13" fill="#a9b8cf" text-anchor="start" >CI below reference: A better</text><path d="M319.03999999999996,473 l6,6 l-6,6 l-6,-6 z" fill="#8796ad"/><text x="332.03999999999996" y="484" class="m" font-size="13" fill="#a9b8cf" text-anchor="start" >CI includes reference: no supported difference</text><path d="M733.8199999999999,473 l6,6 l-6,6 l-6,-6 z" fill="#e5684f"/><text x="746.8199999999999" y="484" class="m" font-size="13" fill="#a9b8cf" text-anchor="start" >CI above reference: A worse</text></svg>
