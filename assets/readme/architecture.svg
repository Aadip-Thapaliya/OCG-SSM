<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="OCG-SSM architecture: graph learner, graph-conditioned SSM, regime detector loop"><title>OCG-SSM architecture: graph learner, graph-conditioned SSM, regime detector loop</title><style>
.s{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif} .m{font-family:'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes flow{to{stroke-dashoffset:-40}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.fade{animation:fade .8s ease-out both} .rise{animation:rise .7s ease-out both}
.flow{stroke-dasharray:8 6;animation:flow 1.6s linear infinite}
</style><defs><linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#15243e"/><stop offset="1" stop-color="#0e1a2f"/></linearGradient><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a9b8cf"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f0803c"/></marker></defs><rect x="4" y="4" width="1192" height="552" rx="16" fill="url(#pg)" stroke="#2a3d61"/><g class="rise" style="animation-delay:0.00s"><rect x="40" y="236" width="180" height="92" rx="12" fill="#0e1a2f" stroke="#2a3d61" stroke-width="1.6"/><text x="130.0" y="278.0" class="s" font-size="17" fill="#f3e9d2" text-anchor="middle" font-weight="700" >Input window</text><text x="130.0" y="300.0" class="m" font-size="13.5" fill="#a9b8cf" text-anchor="middle" >(L, D)</text></g><g class="rise" style="animation-delay:0.10s"><rect x="250" y="236" width="150" height="92" rx="12" fill="#0e1a2f" stroke="#2a3d61" stroke-width="1.6"/><text x="325.0" y="278.0" class="s" font-size="17" fill="#f3e9d2" text-anchor="middle" font-weight="700" >RevIN</text><text x="325.0" y="300.0" class="m" font-size="13.5" fill="#a9b8cf" text-anchor="middle" >normalise</text></g><g class="rise" style="animation-delay:0.20s"><rect x="430" y="236" width="300" height="92" rx="12" fill="#0e1a2f" stroke="#5fb3a6" stroke-width="1.6"/><text x="580.0" y="278.0" class="s" font-size="17" fill="#f3e9d2" text-anchor="middle" font-weight="700" >Graph-conditioned SSM</text><text x="580.0" y="300.0" class="m" font-size="13.5" fill="#a9b8cf" text-anchor="middle" >h_t[i] per variable</text><text x="580.0" y="318.0" class="m" font-size="13.5" fill="#a9b8cf" text-anchor="middle" >scan: O(D²N) per step</text></g><g class="rise" style="animation-delay:0.30s"><rect x="760" y="236" width="170" height="92" rx="12" fill="#0e1a2f" stroke="#2a3d61" stroke-width="1.6"/><text x="845.0" y="278.0" class="s" font-size="17" fill="#f3e9d2" text-anchor="middle" font-weight="700" >Lag + forecast</text><text x="845.0" y="300.0" class="m" font-size="13.5" fill="#a9b8cf" text-anchor="middle" >heads</text></g><g class="rise" style="animation-delay:0.40s"><rect x="960" y="236" width="200" height="92" rx="12" fill="#0e1a2f" stroke="#2a3d61" stroke-width="1.6"/><text x="1060.0" y="278.0" class="s" font-size="17" fill="#f3e9d2" text-anchor="middle" font-weight="700" >Forecast</text><text x="1060.0" y="300.0" class="m" font-size="13.5" fill="#a9b8cf" text-anchor="middle" >(H, D), de-normalised</text></g><line x1="224" y1="282.0" x2="244" y2="282.0" stroke="#a9b8cf" stroke-width="2" class="flow" marker-end="url(#ar)"/><line x1="404" y1="282.0" x2="424" y2="282.0" stroke="#a9b8cf" stroke-width="2" class="flow" marker-end="url(#ar)"/><line x1="734" y1="282.0" x2="754" y2="282.0" stroke="#a9b8cf" stroke-width="2" class="flow" marker-end="url(#ar)"/><line x1="934" y1="282.0" x2="954" y2="282.0" stroke="#a9b8cf" stroke-width="2" class="flow" marker-end="url(#ar)"/><g class="rise" style="animation-delay:0.30s"><rect x="380" y="60" width="400" height="100" rx="12" fill="#0e1a2f" stroke="#f0803c" stroke-width="1.6"/><text x="580.0" y="106.0" class="s" font-size="17" fill="#f3e9d2" text-anchor="middle" font-weight="700" >GraphLearner</text><text x="580.0" y="128.0" class="m" font-size="13.5" fill="#a9b8cf" text-anchor="middle" >logits Lg (K, D, D)</text><text x="580.0" y="146.0" class="m" font-size="13.5" fill="#a9b8cf" text-anchor="middle" >A = sigmoid(Lg / τ)  →  EMA</text></g><line x1="580" y1="164" x2="580" y2="230" stroke="#f0803c" stroke-width="2.4" class="flow" marker-end="url(#ao)"/><text x="592" y="204" class="m" font-size="14" fill="#f0803c" text-anchor="start" >adjacency mask A  (only edges couple states)</text><g class="rise" style="animation-delay:0.50s"><rect x="250" y="404" width="330" height="100" rx="12" fill="#0e1a2f" stroke="#2a3d61" stroke-width="1.6"/><text x="415.0" y="450.0" class="s" font-size="17" fill="#f3e9d2" text-anchor="middle" font-weight="700" >Structural score S(G)</text><text x="415.0" y="472.0" class="m" font-size="13.5" fill="#a9b8cf" text-anchor="middle" >masked linear VAR</text><text x="415.0" y="490.0" class="m" font-size="13.5" fill="#a9b8cf" text-anchor="middle" >+ λ · sparsity</text></g><g class="rise" style="animation-delay:0.60s"><rect x="640" y="404" width="300" height="100" rx="12" fill="#0e1a2f" stroke="#2a3d61" stroke-width="1.6"/><text x="790.0" y="450.0" class="s" font-size="17" fill="#f3e9d2" text-anchor="middle" font-weight="700" >RegimeDetector</text><text x="790.0" y="472.0" class="m" font-size="13.5" fill="#a9b8cf" text-anchor="middle" >median / MAD z-score</text><text x="790.0" y="490.0" class="m" font-size="13.5" fill="#a9b8cf" text-anchor="middle" >k consecutive steps</text></g><line x1="584" y1="454" x2="634" y2="454" stroke="#a9b8cf" stroke-width="2" class="flow" marker-end="url(#ar)"/><path d="M944,454 H1110 V110 H786" fill="none" stroke="#f0803c" stroke-width="2.2" class="flow" marker-end="url(#ao)"/><text x="1100" y="200" class="m" font-size="14" fill="#f0803c" text-anchor="end" >on detection:</text><text x="1100" y="220" class="m" font-size="14" fill="#f0803c" text-anchor="end" >graph lr × boost</text><text x="1100" y="240" class="m" font-size="14" fill="#f0803c" text-anchor="end" >S5b: EMA reset</text><text x="1100" y="260" class="m" font-size="14" fill="#f0803c" text-anchor="end" >+ replay refit</text><path d="M130,332 V454 H244" fill="none" stroke="#a9b8cf" stroke-width="2" class="flow" marker-end="url(#ar)"/><text x="40" y="44" class="m" font-size="14" fill="#6b7f9e" text-anchor="start" >graph and forecaster train with separate optimizers</text><text x="40" y="536" class="m" font-size="14.5" fill="#a9b8cf" text-anchor="start" >prequential: every window is forecast first; its targets are used for training only once observed</text></svg>
